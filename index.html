const boxes=[...new Set(D.map(d=>d[2]))].sort((a,b)=>a-b);
let mode="all";
const chips=[["all","ทั้งหมด"],["new","🆕 หนังใหม่ ("+D.filter(isNew).length+")"],...boxes.map(b=>[b,"กล่อง "+b])];
function draw(){c.innerHTML=chips.map(([k,t])=>`<button class="${k==mode?"on":""}" onclick="mode='${k}';draw();show()">${t}</button>`).join("")}
function show(){
  const t=norm(q.value).split(/\s+/).filter(Boolean);
  let hits=D.map((d,i)=>[d,i]).filter(([d,i])=>t.every(w=>idx[i].includes(w))&&(mode=="all"||(mode=="new"?isNew(d):d[2]==mode))).map(x=>x[0]);
  if(mode=="new")hits.sort((a,b)=>b[4].localeCompare(a[4]));
  n.textContent=`พบ ${hits.length} เรื่อง`;
  r.innerHTML=hits.slice(0,300).map(d=>`<li>${esc(d[0])}<small><b>กล่อง ${d[2]}</b> (${esc(d[3])}) · ${esc(d[1])}${isNew(d)?" · 🆕 เพิ่ม "+d[4]:""}</small></li>`).join("");
}
q.oninput=show;draw();show();
</script></body></html>
