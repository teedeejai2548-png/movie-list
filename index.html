<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>หนังในกล่อง HDD</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
header{position:sticky;top:0;background:#111;padding:12px 16px;border-bottom:1px solid #333}
input{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border-radius:8px;border:0}
#n{color:#999;font-size:13px;margin-top:6px}
li{list-style:none;padding:12px 16px;border-bottom:1px solid #222;font-size:18px}
ul{margin:0;padding:0}
small{display:block;color:#9cf;margin-top:6px;font-size:18px}
#c{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
#c button{flex:none;padding:6px 12px;border-radius:16px;border:1px solid #444;background:#222;color:#eee;font-size:14px}
#c button.on{background:#fc0;color:#000;border-color:#fc0}
b{background:#fc0;color:#000;padding:2px 10px;border-radius:6px;font-size:20px;margin-right:6px}
</style></head><body>
<header><input id="q" type="search" placeholder="พิมพ์ชื่อหนัง ไทยหรืออังกฤษ..." autofocus><div id="c"></div><div id="n"></div></header>
<ul id="r"></ul>
<script>
const UI="28/11 13:54";
let D=[],idx=[],boxes=[],chips=[],built="",mode="all";
const norm=s=>s.toLowerCase().normalize("NFKC");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cut=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
const isNew=d=>d[4]&&d[4]>=cut;
function draw(){c.innerHTML=chips.map(([k,t])=>`<button class="${k==mode?"on":""}" onclick="mode='${k}';draw();show()">${t}</button>`).join("")}
function show(){
  const t=norm(q.value).split(/\s+/).filter(Boolean);
  let hits=D.map((d,i)=>[d,i]).filter(([d,i])=>t.every(w=>idx[i].includes(w))&&(mode=="all"||(mode=="new"?isNew(d):d[2]==mode))).map(x=>x[0]);
  if(mode=="new")hits.sort((a,b)=>b[4].localeCompare(a[4]));
  n.textContent=`พบ ${hits.length} เรื่อง · อัปเดต ${built}`;
  r.innerHTML=hits.slice(0,300).map(d=>`<li>${esc(d[0])}<small><b>กล่อง ${d[2]}</b> ${d[3]?"("+esc(d[3])+")":""} · ${esc(d[1])}${isNew(d)?" · 🆕 เพิ่ม "+d[4]:""}</small></li>`).join("");
}
q.oninput=show;
// data.json is fetched fresh each visit (page itself may be cached up to 10 min by GitHub Pages)
fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(x=>x.json()).then(j=>{
  if(j.built!=UI&&!location.search.includes("v="+j.built)){location.replace("?v="+encodeURIComponent(j.built));return}
  D=j.items;built=j.built;idx=D.map(d=>norm(d[0]));
  boxes=[...new Set(D.map(d=>d[2]))].sort((a,b)=>a-b);
  chips=[["all","ทั้งหมด"],["new","🆕 หนังใหม่ ("+D.filter(isNew).length+")"],...boxes.map(b=>[b,"กล่อง "+b])];
  draw();show();
}).catch(()=>n.textContent="โหลดรายชื่อไม่สำเร็จ ลองรีเฟรช");
</script></body></html>
